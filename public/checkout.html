
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | KPOPIFY</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        *{box-sizing:border-box}
        body{margin:0;background:#f5f2ec;color:#10263f;font-family:Arial,sans-serif}
        .checkout-header{padding:22px 7%;background:#10263f;color:white}
        .checkout-header a{color:#f28bb5;text-decoration:none;font-size:26px;font-weight:bold}
        .checkout-container{max-width:1050px;margin:35px auto;padding:0 20px}
        .checkout-container h1{font:36px Georgia,serif;margin-bottom:8px}
        .checkout-subtitle{color:#657788;margin-bottom:28px}
        .checkout-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:25px;align-items:start}
        .checkout-card{background:white;padding:25px;border:1px solid #e0e4e8;border-radius:14px;margin-bottom:20px}
        .checkout-card h2{font:25px Georgia,serif;margin:0 0 20px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .form-field{display:flex;flex-direction:column;gap:7px}
        .form-field.full{grid-column:1/-1}
        .form-field label{font-size:14px;font-weight:bold}
        .form-field input,.form-field textarea{width:100%;padding:12px;border:1px solid #bdc9d3;border-radius:7px;font:15px Arial;color:#10263f;background:white}
        .form-field textarea{min-height:85px;resize:vertical}
        .form-field input:focus,.form-field textarea:focus{outline:2px solid #f28bb5;border-color:#f28bb5}
        .checkout-summary-item{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #e4e7e9;font-size:14px}
        .checkout-summary-item span:first-child{overflow-wrap:anywhere}
        .checkout-grand-total{display:flex;justify-content:space-between;gap:12px;font-size:19px;font-weight:bold;margin:22px 0}
        .place-order-button{width:100%;padding:15px;border:0;border-radius:28px;background:#10263f;color:white;font-size:16px;font-weight:bold;cursor:pointer}
        .place-order-button:hover{background:#f28bb5;color:#10263f}
        .place-order-button:disabled{opacity:.6;cursor:wait}
        .checkout-message{margin-top:15px;color:#b42318;font-size:14px}
        .back-link{display:inline-block;margin:0 0 25px;color:#10263f;text-decoration:none}
        .success-card{text-align:center;background:white;border-radius:16px;padding:40px 25px;margin:35px auto;max-width:600px;border:1px solid #e0e4e8}
        .success-icon{font-size:55px;color:#f28bb5}
        .success-card h1{font:34px Georgia,serif}
        .order-number{display:inline-block;padding:12px 20px;background:#f5f2ec;border-radius:8px;font-weight:bold;letter-spacing:1px}
        .continue-button{display:inline-block;margin-top:20px;padding:13px 25px;background:#10263f;color:white;text-decoration:none;border-radius:25px}
        @media(max-width:700px){.checkout-layout{grid-template-columns:1fr}.checkout-container{margin:25px auto}.checkout-container h1{font-size:30px}.checkout-card{padding:19px}}
        @media(max-width:420px){.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}}
    </style>
</head>
<body>
    <header class="checkout-header">
        <a href="/index.html">KPOPIFY ♡</a>
    </header>

    <main class="checkout-container">
        <a href="/index.html" class="back-link">← Continue shopping</a>
        <section id="checkout-content">
            <h1>Checkout ♡</h1>
            <p class="checkout-subtitle">Enter your delivery details to place your order.</p>

            <form id="checkout-form">
                <div class="checkout-layout">
                    <div>
                        <section class="checkout-card">
                            <h2>Delivery Details</h2>
                            <div class="form-grid">
                                <div class="form-field full">
                                    <label for="customer-name">Full name *</label>
                                    <input id="customer-name" name="name" autocomplete="name" required>
                                </div>
                                <div class="form-field">
                                    <label for="customer-phone">Mobile number *</label>
                                    <input id="customer-phone" name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="tel" placeholder="10-digit number" required>
                                </div>
                                <div class="form-field">
                                    <label for="customer-email">Email *</label>
                                    <input id="customer-email" name="email" type="email" autocomplete="email" required>
                                </div>
                                <div class="form-field full">
                                    <label for="customer-address">House / Street address *</label>
                                    <textarea id="customer-address" name="address" autocomplete="street-address" required></textarea>
                                </div>
                                <div class="form-field">
                                    <label for="customer-city">City *</label>
                                    <input id="customer-city" name="city" autocomplete="address-level2" required>
                                </div>
                                <div class="form-field">
                                    <label for="customer-state">State *</label>
                                    <input id="customer-state" name="state" autocomplete="address-level1" required>
                                </div>
                                <div class="form-field">
                                    <label for="customer-pincode">PIN code *</label>
                                    <input id="customer-pincode" name="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="postal-code" placeholder="6-digit PIN code" required>
                                </div>
                                <div class="form-field full">
                                    <label for="customer-instructions">Delivery instructions (optional)</label>
                                    <textarea id="customer-instructions" name="instructions" placeholder="Any instructions for delivery?"></textarea>
                                </div>
                            </div>
                        </section>
                    </div>

                    <div>
                        
<section class="checkout-card">
    <h2>Your Order</h2>

    <div id="checkout-items">Loading your cart...</div>

    <div class="checkout-grand-total">
        <span>Total</span>
        <span id="checkout-total">₹0</span>
    </div>

    <div class="form-field" style="margin-bottom:20px;">
        <label for="payment-method">Select Payment Method *</label>

        <select
            id="payment-method"
            name="paymentMethod"
            required
            style="width:100%;padding:12px;border:1px solid #bdc9d3;border-radius:7px;font:15px Arial;color:#10263f;background:white;"
        >
            <option value="">Choose a payment method</option>
            <option value="Google Pay">Google Pay </option>
            <option value="PhonePe">PhonePe </option>
            <option value="Paytm">Paytm </option>
            <option value="Credit/Debit Card">Credit/Debit Card</option>
            <option value="Cash on Delivery">Cash on Delivery </option>
        </select>

        <small style="color:#657788;line-height:1.5;">
            College project demonstration only. No real payment will be processed.
        </small>
    </div>

    <button
        class="place-order-button"
        id="place-order-button"
        type="submit"
    >
        Place Order ♡
    </button>

    <p id="checkout-message" class="checkout-message" role="alert"></p>
</section>

                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="/js/checkout.js"></script>
</body>
</html>
